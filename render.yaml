services:
  - type: web
    name: ai-resume-screening
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: Dockerfile
    disk:
      name: resume-uploads
      mountPath: /app/data/uploads
      sizeGB: 10
    envVars:
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: resume-screening-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_TOKEN_TTL_MINUTES
        value: "720"
      - key: UPLOAD_STORAGE_DIR
        value: "/app/data/uploads"
      - key: EMBEDDING_LOCAL_FILES_ONLY
        value: "true"
      - key: HF_HOME
        value: "/app/hf-cache"

databases:
  - name: resume-screening-db
    plan: standard
    region: oregon
