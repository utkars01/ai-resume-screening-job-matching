# ─────────────────────────────────────────────────────────────
# Render Blueprint — Backend API only (free tier)
# Frontend → Vercel  |  Database → Neon (external)
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: ai-resume-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: sh scripts/entrypoint.sh
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false          # Paste your Neon connection string in Render dashboard
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_TOKEN_TTL_MINUTES
        value: "720"
      - key: UPLOAD_STORAGE_DIR
        value: "/tmp/uploads"
      - key: EMBEDDING_LOCAL_FILES_ONLY
        value: "true"
      - key: HF_HOME
        value: "/tmp/hf-cache"
      - key: SERVE_FRONTEND
        value: "false"
      - key: CORS_ORIGINS
        sync: false          # Paste your Vercel frontend URL here, e.g. https://my-app.vercel.app
